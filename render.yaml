# Render Blueprint - free web service, no payment method needed.
services:
  - type: web
    name: parksense
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: cd app && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: OMP_NUM_THREADS
        value: "1"
